name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Audit exact tracked files
        run: python tools/audit_repository.py --staged
      - name: Validate checkpoint collection
        run: python tools/check_checkpoints.py
      - name: Synthetic unit tests (no original game files)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -q
