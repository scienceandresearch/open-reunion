[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-reunion"
version = "0.38.0a8"
description = "Open Reunion native strategy game port - early testing build"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
open-reunion = "openreunion.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openreunion = ["data/*.json"]
